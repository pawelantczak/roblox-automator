name: Build & Release Roblox Automator

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Suite on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Read App Version
        id: get_version
        shell: pwsh
        run: |
          $VERSION = (Get-Content VERSION).Trim()
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $VERSION"

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Archive
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $zipName = "Roblox-Automator-v$ver-windows-x64.zip"
          Copy-Item target/release/roblox-automator.exe -Destination "roblox-automator.exe"
          Compress-Archive -Path "roblox-automator.exe" -DestinationPath $zipName
          Write-Host "Created archive: $zipName and standalone roblox-automator.exe"

      - name: Upload Build Artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Automator-v${{ steps.get_version.outputs.version }}-windows-x64
          path: |
            roblox-automator.exe
            Roblox-Automator-v*.zip
          retention-days: 14

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}".TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$ver\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          if ($changelog -match $pattern) {
              $notes = $matches[1].Trim()
          } else {
              $unrelPattern = '(?s)## \[Unreleased\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              if ($changelog -match $unrelPattern) {
                  $notes = $matches[1].Trim()
              } else {
                  $notes = "Release v$ver"
              }
          }
          $notes = $notes -replace '(?m)\n---\s*$', ''
          Set-Content -Path RELEASE_NOTES.md -Value $notes
          Write-Host "Extracted release notes:"
          Write-Host $notes

      - name: Publish GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Roblox Automator v${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            roblox-automator.exe
            Roblox-Automator-v*.zip
