name: Build & Release Roblox Automator

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Suite on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Read App Version
        id: get_version
        shell: pwsh
        run: |
          $VERSION = (Get-Content VERSION).Trim()
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $VERSION"

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Unsigned Binary (SignPath)
        id: upload-unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roblox-automator-unsigned-${{ steps.get_version.outputs.version }}
          path: target/release/roblox-automator.exe
          retention-days: 1

      - name: Sign Release Binary (SignPath)
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-output

      - name: Verify Code Signature
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signedExe = "signed-output/roblox-automator.exe"
          if (-not (Test-Path $signedExe)) {
            throw "Expected signed binary at $signedExe"
          }
          $sig = Get-AuthenticodeSignature -FilePath $signedExe
          Write-Host "Signature status: $($sig.Status) | Subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature verification failed: $($sig.StatusMessage)"
          }

      - name: Package Release Archive
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $zipName = "Roblox-Automator-v$ver.zip"
          $exeSource = if (Test-Path "signed-output/roblox-automator.exe") {
            "signed-output/roblox-automator.exe"
          } else {
            "target/release/roblox-automator.exe"
          }
          Compress-Archive -Path $exeSource -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName containing roblox-automator.exe (source: $exeSource)"

      - name: Upload Build Artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Automator-v${{ steps.get_version.outputs.version }}
          path: |
            Roblox-Automator-v*.zip
          retention-days: 14

      - name: Extract Release Notes from RELEASE_NOTES.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}".TrimStart('v')
          $releaseNotes = Get-Content RELEASE_NOTES.md -Raw
          $pattern = "(?s)## \[$ver\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          if ($releaseNotes -match $pattern) {
              $notes = $matches[1].Trim()
          } else {
              $unrelPattern = '(?s)## \[Unreleased\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              if ($releaseNotes -match $unrelPattern) {
                  $notes = $matches[1].Trim()
              } else {
                  $notes = "Release v$ver"
              }
          }
          $notes = $notes -replace '(?m)\n---\s*$', ''
          Set-Content -Path RELEASE_NOTES_BODY.md -Value $notes
          Write-Host "Extracted release notes:"
          Write-Host $notes

      - name: Publish GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Roblox Automator v${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES_BODY.md
          generate_release_notes: true
          files: |
            Roblox-Automator-v*.zip
